name: Verify and publish GeoStat Lab

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geostat-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    # Keep the OS aligned with the pinned Playwright release; do not use ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts --no-fund --no-audit --prefer-online --registry=https://registry.npmjs.org --cache "$RUNNER_TEMP/geostat-npm-cache"
      - name: Verify installed dependency tree
        run: npm ls --all
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Verify course, catalogue and build
        run: npm test
      - name: Verify all mathematical expressions
        run: |
          npm run test:dom
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build with deployment URL
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: npm run build
      - name: Check browser test platform
        run: |
          python3 - <<'PYTHON'
          import platform, sys
          from pathlib import Path
          release = dict(line.split('=', 1) for line in Path('/etc/os-release').read_text().splitlines() if '=' in line)
          actual = (release.get('ID', '').strip('"'), release.get('VERSION_ID', '').strip('"'), platform.machine(), sys.version_info[:2])
          expected = ('ubuntu', '24.04', 'x86_64', (3, 12))
          print('Browser test platform:', actual)
          if actual != expected:
              raise SystemExit('Unsupported CI combination: keep ubuntu-24.04, Python 3.12 and Playwright from security/requirements.txt together. Review all three before upgrading.')
          PYTHON
      - name: Install browser test tools
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r security/requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Check navigation and formulas in Chromium
        run: npm run test:browser
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-diagnostics
          path: qa/browser
          if-no-files-found: ignore
          retention-days: 7
      - name: Prepare static site
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: verify-build
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
